<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15803D">
  <title>Presensi Sambung · Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fff; color: #1c1917; text-align: center; padding: 24px; box-sizing: border-box; }
    .box { max-width: 360px; } h1 { font-size: 20px; margin: 16px 0 8px; } p { color: #6b6461; margin: 0 0 20px; line-height: 1.5; }
    button { font: inherit; font-weight: 700; padding: 12px 20px; border-radius: 12px; border: 0; background: #15803D; color: #fff; cursor: pointer; }
    img { width: 72px; height: 72px; border-radius: 18px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="icons/icon-192.png" alt="">
    <h1>Belum ada koneksi internet</h1>
    <p>Presensi Sambung perlu internet saat dibuka pertama kali di HP ini. Sambungkan internet lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
